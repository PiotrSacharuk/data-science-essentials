[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "data-science-essentials"
version = "0.1.0"
description = "Essential tools for data science"
authors = ["PiotrSacharuk"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.14"
pandas = "^2.3.2"
numpy = "^2.2.6"
fastapi = {version = "^0.141.1", extras = ["standard"]}
httpx = "^0.28.1"
pydantic = "^2.12.3"
requests = "^2.33.1"
uvicorn = "^0.38.0"
python-multipart = ">=0.0.22,<0.0.32"
email-validator = "^2.3.0"
python-dotenv = "^1.1.1"
pydantic-settings = "^2.11.0"
httpx2 = "^2.12.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<10.0.0"
pytest-cov = "^7.0.0"
pytest-json-report = "^1.5.0"
pre-commit = "^4.3.0"
black = "^26.3.1"
ruff = "^0.14.2"

[tool.poetry.group.notebooks]
optional = true

[tool.poetry.group.notebooks.dependencies]
jupyter = "^1.0.0"
jupyterlab = ">=4.5.10,<5.0.0"
papermill = "^2.4.0"
nbconvert = "^7.17.0"
matplotlib = "^3.5.0"
seaborn = "^0.12.0"
plotly = "^5.10.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=src --cov=app --cov-report=html --cov-fail-under=99"

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
line-length = 88
target-version = "py314"
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.isort]
known-first-party = ["src"]
